<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Updated Viewport for Mobile App Feel (Handle Notch) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1f1f" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pat's To-Do List v3.5 Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: 'var(--bg-main)',
                        bgSurface: 'var(--bg-surface)',
                        bgHover: 'var(--bg-hover)',
                        textMain: 'var(--text-main)',
                        textMuted: 'var(--text-muted)',
                        borderMain: 'var(--border-main)',
                        cyan: '#00FFFF',
                        hotpink: '#FF007F',
                        lime: '#32CD32',
                        orange: '#FF5F00',
                        purple: '#9D00FF'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-main: hsl(0, 0%, 12%);
            --bg-surface: hsl(0, 0%, 18%);
            --bg-hover: hsl(0, 0%, 25%);
            --text-main: hsl(0, 0%, 95%);
            --text-muted: hsl(0, 0%, 65%);
            --border-main: hsl(0, 0%, 25%);
        }

        /* Safe Area Insets for iPhone Notch/Home Bar */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-main); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .task-card { transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s; cursor: grab; }
        .task-card:active, .task-card.is-dragging { cursor: grabbing !important; }

        /* Styles */
        .style-border { border-left: 5px solid var(--task-color, transparent) !important; }
        .style-highlighter { background-color: var(--task-color-alpha, transparent) !important; border: 1px solid var(--task-color, transparent) !important; }
        .style-glow { box-shadow: 0 0 12px 2px var(--task-color-alpha, transparent) !important; border: 1px solid var(--task-color-alpha, transparent) !important; }
        .style-gradient { background: linear-gradient(135deg, var(--task-color-alpha, transparent) 0%, transparent 100%) !important; border: 1px solid var(--task-color-alpha, transparent) !important; }
        .style-retro { border-bottom: 4px solid var(--task-color, transparent) !important; }
        .drag-over { background-color: rgba(0, 255, 255, 0.1) !important; border-radius: 6px; box-shadow: inset 0 0 0 2px #00FFFF !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
    </style>
</head>
<body class="bg-bgMain text-textMain h-screen flex flex-col overflow-hidden transition-colors duration-300">
    
    <!-- Header -->
    <header class="flex justify-between items-center px-4 py-2 bg-bgSurface shadow-md z-20 shrink-0">
        <div class="flex items-center gap-2">
            <h1 id="app-title" class="text-lg md:text-2xl font-black tracking-tight cursor-pointer hover:text-cyan truncate max-w-[150px] md:max-w-none">Pat's To-Do</h1>
            <span class="hidden md:inline px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-cyan/10 text-cyan border border-cyan/20 rounded-full">v3.5 Live</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="settings-btn" class="p-1.5 text-textMuted hover:text-cyan hover:bg-bgHover rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <input type="range" id="theme-slider" min="0" max="100" class="w-20 md:w-32 accent-cyan cursor-pointer">
        </div>
    </header>

    <!-- Main Content (Responsive Flex: Column on Mobile, Row on Desktop) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Sidebar (Input & List) -->
        <!-- Adjusted: Width full on mobile, fixed on desktop. Height shared on mobile. -->
        <aside class="w-full md:w-[22rem] flex flex-col bg-bgSurface border-b md:border-b-0 md:border-r border-borderMain shadow-inner z-10 shrink-0 h-[45%] md:h-auto relative">
            <!-- Input Area -->
            <div class="p-3 border-b border-borderMain flex gap-2">
                <input type="text" id="new-task-text" placeholder="Add task..." class="flex-1 p-2 bg-bgMain border border-borderMain rounded-md focus:border-cyan outline-none text-sm text-textMain">
                <button id="add-task-btn" class="px-3 bg-cyan text-black font-bold uppercase rounded shadow text-xs">Add</button>
            </div>

            <!-- Tab System for Mobile Space Saving -->
            <div class="flex md:hidden border-b border-borderMain">
                <button id="tab-backlog" class="flex-1 py-2 text-xs font-bold uppercase text-cyan bg-bgMain border-r border-borderMain">Backlog</button>
                <button id="tab-library" class="flex-1 py-2 text-xs font-bold uppercase text-textMuted hover:text-textMain">Library</button>
            </div>

            <!-- Backlog Zone -->
            <div id="mobile-backlog-container" class="flex-1 flex flex-col min-h-0">
                <h2 class="hidden md:block px-4 py-2 text-xs font-black text-textMuted uppercase tracking-widest bg-bgMain border-b border-borderMain">Backlog</h2>
                <div id="backlog-list" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2 drag-container" data-zone="backlog"></div>
            </div>

            <!-- Library Zone -->
            <div id="mobile-library-container" class="hidden md:flex flex-1 flex-col min-h-0 border-t-2 border-borderMain">
                <h2 class="hidden md:flex px-4 py-2 text-xs font-black text-textMuted uppercase tracking-widest bg-bgMain border-b border-borderMain justify-between items-center">
                    Library <svg class="w-4 h-4 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                </h2>
                <div id="library-list" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2 drag-container" data-zone="library"></div>
            </div>

            <!-- Footer -->
            <div class="hidden md:flex p-3 bg-bgSurface justify-between items-center text-xs border-t border-borderMain">
                <span class="text-textMuted font-bold">Sync: <span class="text-cyan">Live</span></span>
                <div class="flex gap-2">
                    <button id="export-btn" class="p-1.5 border border-borderMain rounded hover:text-cyan"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></button>
                    <label class="p-1.5 border border-borderMain rounded hover:text-cyan cursor-pointer"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg><input type="file" id="import-file" class="hidden" accept=".json"></label>
                </div>
            </div>
            
            <div class="p-2 bg-bgMain flex justify-center items-center overflow-hidden border-t border-borderMain">
                <a href="https://www.youtube.com/@KingDavid_Official" target="_blank" class="group flex items-center gap-2 text-xs font-bold text-textMuted hover:text-[#FFD700] transition-all">
                    <span class="truncate">Built with ❤️ by @KingDavid_Official</span>
                </a>
            </div>
        </aside>

        <!-- Calendar Area -->
        <div class="flex-1 flex flex-col bg-bgMain relative min-w-0 h-[55%] md:h-auto">
            <div class="px-2 md:px-6 py-2 border-b border-borderMain flex justify-between items-center bg-bgSurface shadow-sm z-10">
                <div class="flex items-center gap-1">
                    <button id="prev-week" class="px-2 py-1 bg-bgMain border border-borderMain rounded hover:text-cyan">&larr;</button>
                    <button id="today-btn" class="px-3 py-1 border border-cyan text-cyan font-bold rounded text-xs">Today</button>
                    <button id="next-week" class="px-2 py-1 bg-bgMain border border-borderMain rounded hover:text-cyan">&rarr;</button>
                </div>
                <h2 id="week-label" class="text-xs md:text-xl font-black tracking-tight flex-1 text-center truncate px-2">Week...</h2>
                <div class="flex items-center gap-2">
                    <button id="rollover-btn" class="p-1.5 text-orange hover:bg-orange/10 rounded"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg></button>
                    <div class="relative group">
                        <label class="cursor-pointer p-1.5 rounded hover:text-cyan">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <input type="date" id="date-picker" class="absolute opacity-0 w-full h-full cursor-pointer top-0 left-0">
                        </label>
                    </div>
                </div>
            </div>
            <div class="w-full h-1 bg-bgSurface border-b border-borderMain relative z-10">
                <div id="weekly-progress" class="h-full bg-gradient-to-r from-hotpink via-purple to-cyan w-0 transition-all duration-500 ease-out"></div>
            </div>
            <!-- Scrollable Calendar -->
            <div class="flex-1 overflow-x-auto overflow-y-hidden custom-scroll bg-bgMain">
                <div id="calendar-grid" class="grid grid-cols-7 divide-x divide-borderMain min-w-[1000px] h-full pb-2"></div>
            </div>
        </div>
    </main>

    <!-- SETTINGS, EDIT, DELETE MODALS REMAIN SAME (Rest of code below) -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm"><div class="bg-bgSurface p-6 rounded-xl w-[24rem] border border-borderMain text-textMain"><h3 class="text-xl font-bold mb-4">Settings</h3><div class="mb-4"><label class="flex justify-between cursor-pointer"><span class="font-bold">Sound</span><input type="checkbox" id="settings-sound-toggle" class="accent-cyan"></label></div><div class="mb-4"><label class="block text-xs font-bold uppercase mb-2">Sound Pack</label><select id="settings-sound-pack" class="w-full p-2 bg-bgMain border border-borderMain rounded"><option value="party">Party</option><option value="levelup">Level Up</option><option value="fanfare">Fanfare</option><option value="coin">Coin</option></select></div><div class="flex justify-end"><button id="close-settings-btn" class="px-4 py-2 bg-cyan text-black font-bold rounded">Close</button></div></div></div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm"><div class="bg-bgSurface p-6 rounded-xl w-[90%] md:w-[32rem] border border-borderMain text-textMain max-h-[90vh] overflow-y-auto"><h3 class="text-xl font-bold mb-4">Edit Task</h3><input type="text" id="edit-text" class="w-full p-3 mb-4 bg-bgMain border border-borderMain rounded"><div class="mb-4"><label class="block text-xs font-bold uppercase mb-2">Color</label><div class="grid grid-cols-9 gap-2" id="edit-color-picker"></div></div><div class="mb-4"><label class="block text-xs font-bold uppercase mb-2">Style</label><div class="grid grid-cols-3 gap-2"><label><input type="radio" name="edit-style" value="dot"> Dot</label><label><input type="radio" name="edit-style" value="border"> Border</label><label><input type="radio" name="edit-style" value="glow"> Glow</label></div></div><div class="mb-4"><label class="block text-xs font-bold uppercase mb-2">Emoji</label><div class="bg-bgMain border border-borderMain rounded"><div class="flex justify-between p-2 border-b border-borderMain"><div id="edit-emoji-preview" class="text-xl px-2"></div><div><button id="edit-emoji-backspace" class="px-2 text-red-500">⌫</button><button id="edit-emoji-clear" class="px-2 text-red-500 text-xs uppercase">Clear</button></div></div><div id="edit-emoji-tabs" class="flex gap-1 overflow-x-auto p-2 border-b border-borderMain"></div><div id="edit-emoji-grid" class="grid grid-cols-8 gap-2 h-32 overflow-y-auto p-2"></div></div></div><div class="flex justify-between pt-4 border-t border-borderMain"><button id="delete-edit-btn" class="text-red-500 font-bold text-sm">Delete</button><div class="flex gap-2"><button id="cancel-edit-btn" class="px-4 py-2 border border-borderMain rounded">Cancel</button><button id="save-edit-btn" class="px-4 py-2 bg-cyan text-black font-bold rounded">Save</button></div></div></div></div>

    <div id="delete-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center"><div class="bg-bgSurface p-6 rounded-xl w-[20rem] border border-borderMain text-textMain"><h3 class="text-xl font-bold text-red-500 mb-2">Delete?</h3><p class="text-sm text-textMuted mb-4">Cannot be undone.</p><div class="flex justify-end gap-3"><button id="cancel-delete-btn" class="px-4 py-2 border border-borderMain rounded">Cancel</button><button id="confirm-delete-btn" class="px-4 py-2 bg-red-500 text-white font-bold rounded">Delete</button></div></div></div>

    <div id="rollover-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center"><div class="bg-bgSurface p-6 rounded-xl w-[24rem] border border-borderMain text-textMain"><h3 class="text-lg font-bold mb-4">Rollover Tasks</h3><div class="flex flex-col gap-3"><button id="btn-move-tasks" class="p-3 border border-borderMain rounded hover:border-cyan text-left font-bold">Move to Next Week</button><button id="btn-copy-tasks" class="p-3 border border-borderMain rounded hover:border-cyan text-left font-bold">Copy to Next Week</button></div><button id="cancel-rollover-btn" class="mt-4 w-full py-2 border border-borderMain rounded">Cancel</button></div></div>

    <div id="export-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center"><div class="bg-bgSurface p-6 rounded-xl w-[24rem] border border-borderMain text-textMain"><h3 class="text-lg font-bold mb-4">Download Backup</h3><a id="manual-download-link" href="#" class="block w-full text-center p-4 border-2 border-dashed border-cyan text-cyan font-bold rounded">Right-Click -> Save Link As...</a><button id="cancel-export-btn" class="mt-4 w-full py-2 border border-borderMain rounded">Close</button></div></div>

    <div id="custom-context-menu" class="hidden absolute z-[100] bg-bgSurface border border-borderMain rounded shadow-xl py-1 w-40 text-sm text-textMain"><button id="ctx-capitalize" class="w-full text-left px-4 py-2 hover:bg-bgHover hover:text-cyan">Capitalize</button><button id="ctx-fix-typos" class="w-full text-left px-4 py-2 hover:bg-bgHover hover:text-cyan">Fix Typos</button><div class="border-t border-borderMain my-1"></div><button id="ctx-clear" class="w-full text-left px-4 py-2 text-red-500 hover:bg-bgHover">Clear</button></div>
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { db } from './src/firebase.js';
        import { doc, onSnapshot, setDoc } from "firebase/firestore";

        // CONFIG
        const icons = { pin: '📌', trash: '🗑️', check: '✅', uncheck: '⭕' };
        let audioCtx = null;
        function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }
        const COLORS = [ {hex:null}, {hex:'#000000'}, {hex:'#FF69B4'}, {hex:'#FF1493'}, {hex:'#FF007F'}, {hex:'#FF7F50'}, {hex:'#FFD700'}, {hex:'#32CD32'}, {hex:'#00FFFF'}, {hex:'#00BFFF'}, {hex:'#9D00FF'}, {hex:'#FFFFFF'} ];
        const EMOJIS = { 'Status': ['none', '❌', '✅', '🚩', '🔥', '⭐'], 'Faces': ['none', '😀', '😎', '🤯', '🤠', '👻'], 'Animals': ['none', '🐶', '🐱', '🐸', '🦄', '🦖'] };
        function formatLocalDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        let state = { appName: "Pat's To-Do", themeValue: 12, soundEnabled: false, soundPack: 'party', currentDate: formatLocalDate(new Date()), backlog: [], library: [], calendar: {} };
        function generateId() { return Date.now().toString() + Math.random().toString(36).substr(2, 5); }

        // SYNC
        const docRef = doc(db, "apps", "pats-data-v3-5");
        async function saveState() { try { await setDoc(docRef, state); } catch(e){ console.log(e); } }
        function loadState() {
            onSnapshot(docRef, (snap) => {
                if(snap.exists()) {
                    state = { ...state, ...snap.data() };
                    if(!state.calendar) state.calendar = {};
                    if(!Array.isArray(state.backlog)) state.backlog = [];
                    updateTheme(state.themeValue || 12);
                    document.getElementById('theme-slider').value = state.themeValue || 12;
                    document.getElementById('app-title').textContent = state.appName;
                    renderAll();
                } else saveState();
            });
        }

        document.addEventListener('DOMContentLoaded', () => { 
            setupEventListeners(); 
            setupSettings(); 
            setupMobileTabs();
            loadState(); 
        });

        let isPinActive = false;

        function setupMobileTabs() {
            const btnBacklog = document.getElementById('tab-backlog');
            const btnLibrary = document.getElementById('tab-library');
            const contBacklog = document.getElementById('mobile-backlog-container');
            const contLibrary = document.getElementById('mobile-library-container');

            // On mobile, default to backlog
            btnBacklog.onclick = () => {
                contBacklog.classList.remove('hidden');
                contLibrary.classList.add('hidden');
                contLibrary.classList.remove('flex');
                btnBacklog.classList.add('text-cyan', 'bg-bgMain', 'border-r');
                btnBacklog.classList.remove('text-textMuted', 'bg-bgSurface');
                btnLibrary.classList.remove('text-cyan', 'bg-bgMain', 'border-l');
                btnLibrary.classList.add('text-textMuted', 'bg-bgSurface');
                isPinActive = false;
            };

            btnLibrary.onclick = () => {
                contBacklog.classList.add('hidden');
                contLibrary.classList.remove('hidden');
                contLibrary.classList.add('flex');
                btnLibrary.classList.add('text-cyan', 'bg-bgMain', 'border-l');
                btnLibrary.classList.remove('text-textMuted', 'bg-bgSurface');
                btnBacklog.classList.remove('text-cyan', 'bg-bgMain', 'border-r');
                btnBacklog.classList.add('text-textMuted', 'bg-bgSurface');
                isPinActive = true;
            };
        }

        function setupEventListeners() {
            document.getElementById('add-task-btn').onclick = addTask;
            document.getElementById('theme-slider').addEventListener('input', (e) => updateTheme(e.target.value));
            document.getElementById('theme-slider').addEventListener('change', (e) => { state.themeValue = e.target.value; saveState(); });
            
            document.addEventListener('dblclick', (e) => {
                const el = e.target.closest('.task-item');
                if (el) openEditor(el.getAttribute('data-id'), el.getAttribute('data-zone'), el.getAttribute('data-date'));
            });

            // Nav
            document.getElementById('prev-week').onclick = () => shiftWeek(-1);
            document.getElementById('next-week').onclick = () => shiftWeek(1);
            document.getElementById('today-btn').onclick = () => { state.currentDate = formatLocalDate(new Date()); saveState(); };
            document.getElementById('date-picker').addEventListener('change', (e) => { if(e.target.value) { state.currentDate = e.target.value; saveState(); } });

            // Editor
            document.getElementById('cancel-edit-btn').onclick = closeEditor;
            document.getElementById('save-edit-btn').onclick = saveEdit;
            document.getElementById('delete-edit-btn').onclick = deleteFromEditor;
            document.getElementById('cancel-delete-btn').onclick = cancelDelete;
            document.getElementById('confirm-delete-btn').onclick = confirmDelete;
            
            // Emoji
            document.getElementById('edit-emoji-backspace').onclick = (e) => { e.preventDefault(); if(editingContext && editingContext.tempEmoji && editingContext.tempEmoji !== 'none') { const c = Array.from(editingContext.tempEmoji); c.pop(); editingContext.tempEmoji = c.length > 0 ? c.join('') : 'none'; renderEditorPickers(editingContext.tempColor, editingContext.tempEmoji, editingContext.activeEmojiCategory); }};
            document.getElementById('edit-emoji-clear').onclick = (e) => { e.preventDefault(); if(editingContext) { editingContext.tempEmoji = 'none'; renderEditorPickers(editingContext.tempColor, 'none', editingContext.activeEmojiCategory); }};
            document.getElementById('edit-emoji-done').onclick = (e) => { e.preventDefault(); saveEdit(); };

            // Modals
            document.getElementById('rollover-btn').onclick = () => document.getElementById('rollover-modal').classList.remove('hidden');
            document.getElementById('cancel-rollover-btn').onclick = () => document.getElementById('rollover-modal').classList.add('hidden');
            document.getElementById('btn-move-tasks').onclick = () => rollOverTasks('move');
            document.getElementById('btn-copy-tasks').onclick = () => rollOverTasks('copy');
            
            // Backup
            const expBtn = document.getElementById('export-btn'); if(expBtn) expBtn.onclick = exportData;
            document.getElementById('cancel-export-btn').onclick = () => document.getElementById('export-modal').classList.add('hidden');
            const impFile = document.getElementById('import-file'); if(impFile) impFile.addEventListener('change', importData);
        }

        // --- SOUND ENGINE (RESTORED) ---
        function playSynthesizedSound(type) {
            initAudio(); if (!state.soundEnabled) return;
            try {
                const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'party') { osc.frequency.setValueAtTime(523, t); osc.frequency.setValueAtTime(659, t+0.1); osc.frequency.setValueAtTime(783, t+0.2); gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.5); osc.start(t); osc.stop(t+0.5); }
                else if (type === 'coin') { osc.type='square'; osc.frequency.setValueAtTime(987, t); osc.frequency.setValueAtTime(1318, t+0.1); gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.4); osc.start(t); osc.stop(t+0.4); }
                else { osc.frequency.setValueAtTime(400, t); gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.2); osc.start(t); osc.stop(t+0.2); }
            } catch(e){}
        }

        function updateTheme(val) {
            const r = document.documentElement; 
            r.style.setProperty('--bg-main', `hsl(0, 0%, ${val}%)`);
            r.style.setProperty('--bg-surface', `hsl(0, 0%, ${Math.max(0, val<50?Number(val)+6:Number(val)-3)}%)`);
            r.style.setProperty('--bg-hover', `hsl(0, 0%, ${Math.max(0, val<50?Number(val)+12:Number(val)-8)}%)`);
            r.style.setProperty('--border-main', `hsl(0, 0%, ${Math.max(0, val<50?Number(val)+15:Number(val)-15)}%)`);
            if(val<50){r.style.setProperty('--text-main',`hsl(0,0%,95%)`);r.style.setProperty('--text-muted',`hsl(0,0%,65%)`);}
            else{r.style.setProperty('--text-main',`hsl(0,0%,10%)`);r.style.setProperty('--text-muted',`hsl(0,0%,40%)`);}
        }

        function setupTitleEdit() {
            const t = document.getElementById('app-title');
            t.ondblclick = () => { t.contentEditable = "true"; t.focus(); };
            t.onblur = () => { t.contentEditable = "false"; if(t.textContent!==state.appName){state.appName=t.textContent;saveState();} };
        }

        function addTask() {
            const i=document.getElementById('new-task-text'); let t=i.value.trim(); if(!t)return;
            t = t.charAt(0).toUpperCase() + t.slice(1);
            const n={id:generateId(),text:t,color:null,emoji:'none',style:'dot',isPinned:isPinActive,isCompleted:false};
            if(isPinActive) state.library.push(n); else state.backlog.push(n);
            i.value=''; saveState(); renderAll();
        }

        function renderAll() {
            renderSidebar(); renderCalendar(); setupDragAndDrop();
        }

        function renderSidebar() {
            const b=document.getElementById('backlog-list'); b.innerHTML='';
            state.backlog.sort((a,b)=>a.isCompleted-b.isCompleted).forEach(t=>b.appendChild(createTaskElement(t,'backlog')));
            
            const l=document.getElementById('library-list'); l.innerHTML='';
            state.library.sort((a,b)=>a.isCompleted-b.isCompleted).forEach(t=>l.appendChild(createTaskElement(t,'library')));
        }

        function createTaskElement(task,zone,dateString=null) {
            const el=document.createElement('div'); 
            el.className=`task-item task-card flex flex-col p-2.5 rounded-md bg-bgSurface border border-borderMain shadow-sm relative group select-none mb-2 ${task.isCompleted?'opacity-50':''}`;
            el.draggable=true; el.id=`task-${task.id}`; el.setAttribute('data-id',task.id); el.setAttribute('data-zone',zone); if(dateString)el.setAttribute('data-date',dateString);
            if(task.color) { 
                el.style.setProperty('--task-color',task.color); el.style.setProperty('--task-color-alpha',task.color+'33'); 
                if(task.style) el.classList.add(`style-${task.style}`);
            }
            el.ondragstart=(e)=>{ const d=JSON.stringify({id:task.id,zone,date:dateString}); e.dataTransfer.setData('text/plain',d); setTimeout(()=>el.style.opacity='0.4',0); el.classList.add('is-dragging'); };
            el.ondragend=()=>{ el.style.opacity=task.isCompleted?'0.5':'1'; el.classList.remove('is-dragging'); renderAll(); };
            
            let emojiHtml = task.emoji && task.emoji !== 'none' ? `<span class="text-lg mr-1">${task.emoji}</span>` : '';
            let dotHtml = task.style==='dot'&&task.color ? `<span class="w-3 h-3 rounded-full border border-black/10 mr-2 shrink-0" style="background-color:${task.color}"></span>` : '';
            
            el.innerHTML = `
                <div class="flex items-start w-full relative">
                    <div class="flex items-center flex-1 min-w-0">
                        ${dotHtml}
                        <div class="text-sm font-semibold break-words leading-snug ${task.isCompleted?'line-through text-textMuted':'text-textMain'}">${emojiHtml}${task.text}</div>
                    </div>
                    <div class="absolute -top-1 -right-1 hidden group-hover:flex items-center gap-1 bg-bgSurface p-1 rounded border border-borderMain shadow-md">
                        <button class="delete-btn p-1 text-red-500 hover:bg-red-500/20 rounded">🗑️</button>
                        <button class="check-btn p-1 ${task.isCompleted?'text-lime':'text-textMuted'} hover:text-lime rounded">${task.isCompleted?'✅':'⭕'}</button>
                    </div>
                </div>`;
            
            // Re-attach listeners manually to avoid innerHTML issues
            el.querySelector('.delete-btn').onclick=(e)=>{e.stopPropagation();requestDelete(task.id,zone,dateString);};
            el.querySelector('.check-btn').onclick=(e)=>{e.stopPropagation();toggleComplete(task.id,zone,dateString,e);};
            
            // Mobile tap to complete? No, sticking to PC behavior (dblclick to edit)
            return el;
        }

        function getStartOfWeek(d){ let x=typeof d==='string'?new Date(d.split('-')[0],d.split('-')[1]-1,d.split('-')[2]):new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }
        function shiftWeek(o){ let d=new Date(state.currentDate); d.setDate(d.getDate()+(o*7)); state.currentDate=formatLocalDate(d); saveState(); }
        
        function renderCalendar() {
            const g=document.getElementById('calendar-grid'); g.innerHTML=''; 
            const s=getStartOfWeek(state.currentDate); 
            const ts=formatLocalDate(new Date());
            const dn=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            
            let tot=0,com=0; 
            for(let i=0;i<7;i++){
                const c=new Date(s); c.setDate(c.getDate()+i); const ds=formatLocalDate(c); 
                const col=document.createElement('div'); col.className='flex flex-col h-full border-r border-borderMain last:border-r-0 min-h-0';
                
                col.innerHTML=`<div class="p-2 text-center border-b border-borderMain bg-bgSurface ${ds===ts?'shadow-[inset_0_-3px_0_0_#00FFFF]':''}"><div class="text-[10px] font-black uppercase ${ds===ts?'text-cyan':'text-textMuted'}">${dn[i]}</div><div class="text-sm font-bold ${ds===ts?'text-cyan':''}">${c.getMonth()+1}/${c.getDate()}</div></div>`;
                const dz=document.createElement('div'); dz.className='flex-1 p-2 overflow-y-auto custom-scroll space-y-2 drag-container bg-bgMain'; dz.setAttribute('data-zone','calendar'); dz.setAttribute('data-date',ds);
                
                const t=state.calendar[ds]||[]; tot+=t.length; com+=t.filter(x=>x.isCompleted).length; 
                t.sort((a,b)=>a.isCompleted-b.isCompleted).forEach(x=>dz.appendChild(createTaskElement(x,'calendar',ds))); 
                col.appendChild(dz); g.appendChild(col);
            }
            document.getElementById('weekly-progress').style.width=tot===0?'0%':`${(com/tot)*100}%`;
            
            const e=new Date(s); e.setDate(e.getDate()+6);
            document.getElementById('week-label').textContent = `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`;
        }

        function setupDragAndDrop() {
            document.querySelectorAll('.drag-container').forEach(z=>{
                z.ondragover=(e)=>{e.preventDefault(); z.classList.add('drag-over');};
                z.ondragleave=(e)=>{z.classList.remove('drag-over');};
                z.ondrop=(e)=>{e.preventDefault(); z.classList.remove('drag-over'); const d=JSON.parse(e.dataTransfer.getData('text/plain')); handleDrop(d.id,d.zone,d.date,z.getAttribute('data-zone'),z.getAttribute('data-date'));};
            });
        }

        function handleDrop(id,sz,sd,tz,td) {
            const sl=getTaskList(sz,sd); const idx=sl.findIndex(t=>t.id===id); if(idx===-1)return; const t=sl[idx];
            let clone=(sz==='library'&&tz==='calendar'); let mv=clone?{...t,id:generateId()}:t;
            if(!clone)sl.splice(idx,1); if(tz==='library')mv.isPinned=true; else if(tz==='backlog')mv.isPinned=false;
            getTaskList(tz,td,true).push(mv); saveState();
        }

        function toggleComplete(id,z,d,e) {
            let l=getTaskList(z,d); const t=l.find(x=>x.id===id); if(t){t.isCompleted=!t.isCompleted; if(t.isCompleted){if(state.soundEnabled)playSynthesizedSound(state.soundPack); if(typeof confetti!=='undefined')confetti({particleCount:100,spread:80,origin:{x:e?e.clientX/window.innerWidth:0.5,y:e?e.clientY/window.innerHeight:0.5}});} saveState();}
        }

        function deleteTask(id,z,d) { const l=getTaskList(z,d); const i=l.findIndex(x=>x.id===id); if(i!==-1){l.splice(i,1); saveState();} }
        function getTaskList(z,d,c=false) { if(z==='backlog')return state.backlog; if(z==='library')return state.library; if(z==='calendar'){if(c&&!state.calendar[d])state.calendar[d]=[]; return state.calendar[d]||[];} return []; }

        // EDITOR
        let editingContext=null;
        function openEditor(id,z,d) {
            const t=getTaskList(z,d).find(x=>x.id===id); if(!t)return; editingContext={task:t,zone:z,dateString:d,tempEmoji:t.emoji||'none',tempColor:t.color};
            document.getElementById('edit-text').value=t.text;
            document.getElementsByName('edit-style').forEach(r=>{r.checked=(r.value===(t.style||'dot'));});
            renderEditorPickers(t.color,t.emoji); document.getElementById('edit-modal').classList.remove('hidden');
        }
        function renderEditorPickers(ac,ae) {
            const cp=document.getElementById('edit-color-picker'); cp.innerHTML=''; 
            COLORS.forEach(c=>{const b=document.createElement('button');b.className=`w-6 h-6 rounded-full border ${ac===c.hex?'ring-2 ring-cyan':''}`; if(c.hex)b.style.backgroundColor=c.hex;else b.textContent='🚫'; b.onclick=()=>renderEditorPickers(c.hex,editingContext.tempEmoji); cp.appendChild(b);});
            
            const et=document.getElementById('edit-emoji-tabs'); et.innerHTML=''; 
            Object.keys(EMOJIS).forEach(c=>{const b=document.createElement('button');b.className='px-2 py-1 text-xs bg-bgMain rounded border border-borderMain';b.textContent=c;b.onclick=()=>{renderEmojiGrid(c);};et.appendChild(b);});
            
            renderEmojiGrid('Faces'); // Default
            editingContext.tempColor=ac; editingContext.tempEmoji=ae;
            document.getElementById('edit-emoji-preview').textContent=ae||'none';
        }
        function renderEmojiGrid(cat) {
            const eg=document.getElementById('edit-emoji-grid'); eg.innerHTML=''; 
            EMOJIS[cat].forEach(e=>{const b=document.createElement('button');b.className='text-xl p-1 hover:bg-bgHover rounded';b.textContent=e==='none'?'🚫':e;b.onclick=()=>{ if(e==='none')editingContext.tempEmoji='none'; else {if(!editingContext.tempEmoji||editingContext.tempEmoji==='none')editingContext.tempEmoji=e; else editingContext.tempEmoji+=e;} renderEditorPickers(editingContext.tempColor,editingContext.tempEmoji); };eg.appendChild(b);});
        }

        let pdc=null;
        function requestDelete(id,z,d){pdc={id,z,d};document.getElementById('delete-modal').classList.remove('hidden');}
        function confirmDelete(){if(pdc)deleteTask(pdc.id,pdc.z,pdc.d);cancelDelete();}
        function cancelDelete(){pdc=null;document.getElementById('delete-modal').classList.add('hidden');}
        function deleteFromEditor(){if(editingContext)requestDelete(editingContext.task.id,editingContext.zone,editingContext.dateString);closeEditor();}
        function saveEdit(){if(!editingContext)return;let t=document.getElementById('edit-text').value.trim();if(!t)return;let s='dot';document.getElementsByName('edit-style').forEach(r=>{if(r.checked)s=r.value;});editingContext.task.text=t;editingContext.task.style=s;editingContext.task.color=editingContext.tempColor;editingContext.task.emoji=editingContext.tempEmoji;saveState();closeEditor();}
        function closeEditor(){document.getElementById('edit-modal').classList.add('hidden');editingContext=null;}
        function setupSettings(){
            const sb=document.getElementById('settings-btn'); const sm=document.getElementById('settings-modal'); const cb=document.getElementById('close-settings-btn'); const ti=document.getElementById('settings-sound-toggle'); const ps=document.getElementById('settings-sound-pack');
            sb.onclick=()=>{sm.classList.remove('hidden');ti.checked=state.soundEnabled;ps.value=state.soundPack;};
            cb.onclick=()=>sm.classList.add('hidden');
            ti.onchange=()=>{state.soundEnabled=ti.checked;saveState();};
            ps.onchange=(e)=>{state.soundPack=e.target.value;saveState();};
        }
        function setupContextMenu(){} // Simplified for mobile
        function rollOverTasks(m){document.getElementById('rollover-modal').classList.add('hidden');const s=getStartOfWeek(state.currentDate);let mc=0;for(let i=0;i<7;i++){const c=new Date(s);c.setDate(c.getDate()+i);const ds=formatLocalDate(c);const nd=new Date(c);nd.setDate(nd.getDate()+7);const nds=formatLocalDate(nd);if(state.calendar[ds]){const u=[],f=[];state.calendar[ds].forEach(t=>{if(!t.isCompleted){if(m==='copy'){u.push({...t,id:generateId()});f.push(t);}else u.push(t);mc++;}else f.push(t);});if(m==='move')state.calendar[ds]=f;if(u.length>0){if(!state.calendar[nds])state.calendar[nds]=[];state.calendar[nds].push(...u);}}}if(mc>0){saveState();renderAll();showToast(`${m==='move'?'Moved':'Copied'} ${mc} tasks.`);}else showToast('No tasks.');}
        function showToast(m){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='bg-bgSurface border border-borderMain text-textMain px-4 py-3 rounded-md shadow-2xl flex items-center gap-3 font-medium text-sm';t.innerHTML=`<span class="w-3 h-3 rounded-full bg-cyan shadow-[0_0_8px_rgba(0,255,255,0.8)]"></span>${m}`;c.appendChild(t);setTimeout(()=>t.remove(),3000);}
        async function exportData(){const d=JSON.stringify(state,null,2);const b=new Blob([d],{type:"application/json"});try{if(window.showSaveFilePicker&&window.location.protocol!=='file:'){const h=await window.showSaveFilePicker({suggestedName:'pats-backup.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(b);await w.close();showToast("Saved!");}else throw new Error('Fallback');}catch(e){if(e.name!=='AbortError'){document.getElementById('manual-download-link').href=URL.createObjectURL(b);document.getElementById('export-modal').classList.remove('hidden');}}}
        function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=(ev)=>{try{state={...state,...JSON.parse(ev.target.result)};saveState();renderAll();showToast("Restored!");}catch(err){alert("Invalid file");}};r.readAsText(f);e.target.value='';}
    </script>
</body>
</html>
