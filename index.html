<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1f1f1f" />
    <title>Pat's To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: 'var(--bg-main)',
                        bgSurface: 'var(--bg-surface)',
                        bgHover: 'var(--bg-hover)',
                        textMain: 'var(--text-main)',
                        textMuted: 'var(--text-muted)',
                        borderMain: 'var(--border-main)',
                        cyan: '#00FFFF',
                        hotpink: '#FF007F',
                        lime: '#32CD32',
                        orange: '#FF5F00',
                        purple: '#9D00FF'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-main: hsl(0, 0%, 12%);
            --bg-surface: hsl(0, 0%, 18%);
            --bg-hover: hsl(0, 0%, 25%);
            --text-main: hsl(0, 0%, 95%);
            --text-muted: hsl(0, 0%, 65%);
            --border-main: hsl(0, 0%, 25%);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-main); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Task Cards Visual Modes & Interaction */
        .task-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
            cursor: grab;
        }
        .task-card:hover {
            transform: scale(1.02) translateY(-1px);
            z-index: 10;
        }
        .task-card:active, .task-card.is-dragging {
            cursor: grabbing !important;
        }

        /* Visual Styles */
        .style-border { border-left: 5px solid var(--task-color, transparent) !important; }
        .style-highlighter { background-color: var(--task-color-alpha, transparent) !important; border: 1px solid var(--task-color, transparent) !important; }
        .style-glow { box-shadow: 0 0 12px 2px var(--task-color-alpha, transparent) !important; border: 1px solid var(--task-color-alpha, transparent) !important; }
        .style-gradient { background: linear-gradient(135deg, var(--task-color-alpha, transparent) 0%, transparent 100%) !important; border: 1px solid var(--task-color-alpha, transparent) !important; }
        .style-retro { border-bottom: 4px solid var(--task-color, transparent) !important; }
        
        .drag-over { background-color: rgba(0, 255, 255, 0.1) !important; border-radius: 6px; box-shadow: inset 0 0 0 2px #00FFFF !important; }

        ::selection { background-color: rgba(0, 255, 255, 0.3); color: inherit; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
    </style>
</head>
<body class="bg-bgMain text-textMain h-screen flex flex-col overflow-hidden transition-colors duration-300">
    
    <!-- Header -->
    <header class="flex justify-between items-center px-6 py-3 bg-bgSurface shadow-md z-20">
        <div class="flex items-center gap-3">
            <h1 id="app-title" class="text-2xl font-black tracking-tight cursor-pointer hover:text-cyan transition-all transform origin-left" title="Double-click to rename">Pat's To-Do List</h1>
            <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-cyan/10 text-cyan border border-cyan/20 rounded-full select-none shadow-sm">Sync Active</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="settings-btn" class="p-1.5 mr-2 text-textMuted hover:text-cyan hover:bg-bgHover rounded-full transition-all hover:rotate-90" title="Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <input type="range" id="theme-slider" min="0" max="100" class="w-24 md:w-32 accent-cyan cursor-pointer" title="Adjust Brightness">
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-[22rem] flex flex-col bg-bgSurface border-r border-borderMain shadow-inner z-10 flex-shrink-0">
            <!-- Input Area -->
            <div class="p-4 border-b border-borderMain flex flex-col gap-3 relative">
                <input type="text" id="new-task-text" spellcheck="true" placeholder="What needs doing?" class="w-full p-2.5 bg-bgMain border border-borderMain rounded-md focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-shadow text-sm placeholder-textMuted shadow-inner text-textMain">
                <button id="add-task-btn" class="px-5 py-2.5 w-full bg-cyan text-black font-black uppercase tracking-wider rounded shadow hover:bg-opacity-90 hover:shadow-cyan/30 hover:shadow-lg transition-all transform hover:scale-[1.02] active:scale-95 text-sm mt-1">Add Task</button>
            </div>

            <!-- Backlog Zone -->
            <div class="flex-1 flex flex-col min-h-0">
                <h2 class="px-4 py-2 text-xs font-black text-textMuted uppercase tracking-widest bg-bgMain border-b border-borderMain shadow-sm z-10">Backlog (One-Time)</h2>
                <div id="backlog-list" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2 drag-container transition-all" data-zone="backlog"></div>
            </div>

            <!-- Library Zone -->
            <div class="flex-1 flex flex-col min-h-0 border-t-2 border-borderMain">
                <h2 class="px-4 py-2 text-xs font-black text-textMuted uppercase tracking-widest bg-bgMain border-b border-borderMain flex justify-between items-center shadow-sm z-10">
                    Library (Pinned)
                    <svg class="w-4 h-4 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" title="Drag to Calendar to CLONE"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                </h2>
                <div id="library-list" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2 drag-container transition-all" data-zone="library"></div>
            </div>

            <!-- Bottom Section (Backup & Branding) -->
            <div class="mt-auto flex flex-col border-t border-borderMain">
                <div class="p-3 bg-bgSurface flex justify-between items-center text-xs border-b border-borderMain">
                    <span class="text-textMuted font-bold uppercase tracking-wider">Sync Status: <span class="text-cyan">Live (Firebase)</span></span>
                </div>
            </div>
        </aside>

        <!-- Calendar Area -->
        <div class="flex-1 flex flex-col bg-bgMain relative min-w-0">
            <div class="px-6 py-4 border-b border-borderMain flex justify-between items-center bg-bgSurface shadow-sm z-10">
                <div class="flex items-center gap-2">
                    <button id="prev-week" class="px-3 py-1.5 bg-bgMain border border-borderMain text-textMain rounded font-bold hover:bg-bgHover hover:text-cyan transition-colors shadow-sm">&larr; Prev</button>
                    <button id="today-btn" class="px-4 py-1.5 border-2 border-cyan text-cyan font-bold rounded hover:bg-cyan hover:text-bgMain transition-all shadow-sm">Today</button>
                    <button id="next-week" class="px-3 py-1.5 bg-bgMain border border-borderMain text-textMain rounded font-bold hover:bg-bgHover hover:text-cyan transition-colors shadow-sm">Next &rarr;</button>
                </div>
                <h2 id="week-label" class="text-xl font-black tracking-tight flex-1 text-center">Week of ...</h2>
                <div class="flex items-center gap-3">
                    <button id="rollover-btn" class="px-3 py-1.5 text-sm font-bold bg-orange/10 text-orange border border-orange/30 rounded hover:bg-orange hover:text-bgMain transition-all shadow-sm flex items-center gap-1">Move Unfinished &rarr;</button>
                    <div class="relative group">
                        <label class="cursor-pointer flex items-center gap-2 p-2 rounded-full hover:bg-bgHover hover:text-cyan transition-colors shadow-sm border border-transparent hover:border-borderMain bg-bgSurface">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <input type="date" id="date-picker" class="absolute opacity-0 w-full h-full cursor-pointer top-0 left-0">
                        </label>
                    </div>
                </div>
            </div>
            <div class="w-full h-1.5 bg-bgSurface border-b border-borderMain relative z-10">
                <div id="weekly-progress" class="h-full bg-gradient-to-r from-hotpink via-purple to-cyan w-0 transition-all duration-500 ease-out"></div>
            </div>
            <div class="flex-1 overflow-x-auto overflow-y-hidden custom-scroll">
                <div id="calendar-grid" class="grid grid-cols-7 divide-x divide-borderMain min-w-[1100px] h-full pb-2"></div>
            </div>
        </div>
    </main>

    <!-- Modal for Settings -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-bgSurface p-6 rounded-xl shadow-2xl w-[24rem] border border-borderMain text-textMain">
            <h3 class="text-xl font-black mb-5 tracking-tight flex items-center gap-2">Settings</h3>
            <div class="mb-5 bg-bgMain p-4 rounded-lg border border-borderMain">
                <label class="flex items-center justify-between cursor-pointer group">
                    <span class="text-sm font-bold text-textMain group-hover:text-cyan transition-colors">Sound Effects</span>
                    <div class="relative">
                        <input type="checkbox" id="settings-sound-toggle" class="sr-only">
                        <div class="block bg-borderMain w-10 h-6 rounded-full transition-colors duration-300" id="toggle-bg"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300" id="toggle-dot"></div>
                    </div>
                </label>
                <div class="mt-4 pt-4 border-t border-borderMain">
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-textMuted">Sound Pack</label>
                    <select id="settings-sound-pack" class="w-full p-2 bg-bgSurface border border-borderMain hover:border-cyan transition-colors rounded text-sm outline-none cursor-pointer shadow-sm text-textMain">
                        <option value="party">Party Horn 🎉</option>
                        <option value="levelup">Level Up ⬆️</option>
                        <option value="fanfare">Fanfare 🎺</option>
                        <option value="cheer">Crowd Cheer 👏</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button id="close-settings-btn" class="px-6 py-2 bg-cyan text-black font-black uppercase tracking-wider rounded shadow-md hover:bg-opacity-90 hover:shadow-cyan/30 text-sm">Save & Close</button>
            </div>
        </div>
    </div>

    <!-- Modal for Edit Task -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-bgSurface p-6 rounded-xl shadow-2xl w-[32rem] border border-borderMain text-textMain">
            <h3 class="text-xl font-black mb-5 tracking-tight">Edit Task</h3>
            <input type="text" id="edit-text" spellcheck="true" class="w-full p-3 mb-5 bg-bgMain border border-borderMain rounded-md focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan text-sm shadow-inner font-medium text-textMain">
            <div class="mb-5">
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-textMuted">Color Palette</label>
                <div class="grid grid-cols-9 gap-2" id="edit-color-picker"></div>
            </div>
            <div class="mb-5">
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-textMuted">Visual Style</label>
                <div class="grid grid-cols-3 gap-3 bg-bgMain p-3 rounded-md border border-borderMain">
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="dot" class="text-cyan accent-cyan"> Dot</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="border" class="text-cyan accent-cyan"> Border</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="highlighter" class="text-cyan accent-cyan"> Highlight</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="glow" class="text-cyan accent-cyan"> Glow</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="gradient" class="text-cyan accent-cyan"> Gradient</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="retro" class="text-cyan accent-cyan"> Retro</label>
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-textMuted">Emoji</label>
                <div class="flex flex-col bg-bgMain border border-borderMain rounded-md shadow-inner overflow-hidden">
                    <div class="flex justify-between items-center p-2 border-b border-borderMain bg-bgSurface">
                        <div id="edit-emoji-preview" class="text-xl min-h-[32px] flex-1 truncate px-2 text-textMain tracking-widest">none</div>
                        <div class="flex gap-1.5 items-center">
                            <button id="edit-emoji-backspace" class="px-2.5 py-1 bg-bgMain border border-borderMain rounded text-textMuted hover:text-red-500">⌫</button>
                            <button id="edit-emoji-clear" class="px-2.5 py-1 bg-bgMain border border-borderMain rounded text-textMuted hover:text-red-500 text-xs font-bold">Clear</button>
                            <button id="edit-emoji-done" class="ml-1 px-3 py-1 bg-cyan text-black rounded text-xs font-bold uppercase">Done ✓</button>
                        </div>
                    </div>
                    <div id="edit-emoji-tabs" class="flex gap-1 overflow-x-auto custom-scroll p-2 border-b border-borderMain bg-bgSurface"></div>
                    <div id="edit-emoji-grid" class="grid grid-cols-10 gap-2 h-40 overflow-y-auto p-2 custom-scroll bg-bgMain"></div>
                </div>
            </div>
            <div class="flex justify-between items-center mt-6 pt-5 border-t border-borderMain">
                <button id="delete-edit-btn" class="px-4 py-2 text-red-500 font-bold hover:bg-red-500/20 rounded transition-colors text-sm">Delete Task</button>
                <div class="flex gap-3">
                    <button id="cancel-edit-btn" class="px-5 py-2 text-textMuted font-bold hover:bg-bgHover rounded transition-colors text-sm border border-borderMain">Cancel</button>
                    <button id="save-edit-btn" class="px-6 py-2 bg-cyan text-black font-black uppercase tracking-wider rounded shadow-md hover:bg-opacity-90 hover:shadow-cyan/30 text-sm">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Delete -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-bgSurface p-6 rounded-xl shadow-2xl w-[24rem] border border-borderMain text-textMain">
            <h3 class="text-xl font-black mb-2 tracking-tight text-red-500">Delete Task</h3>
            <p class="text-sm text-textMuted mb-6">Are you sure? This cannot be undone.</p>
            <div class="flex justify-end gap-3 pt-4 border-t border-borderMain">
                <button id="cancel-delete-btn" class="px-5 py-2 text-textMuted font-bold hover:bg-bgHover rounded text-sm border border-borderMain">Cancel</button>
                <button id="confirm-delete-btn" class="px-6 py-2 bg-red-500 text-white font-black uppercase tracking-wider rounded text-sm hover:bg-red-600">Delete</button>
            </div>
        </div>
    </div>

    <!-- Modal for Rollover -->
    <div id="rollover-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-bgSurface p-6 rounded-xl shadow-2xl w-[28rem] border border-borderMain text-textMain">
            <h3 class="text-xl font-black mb-2 tracking-tight">Rollover Tasks</h3>
            <div class="flex flex-col gap-3 mb-6">
                <button id="btn-move-tasks" class="w-full text-left p-4 rounded-lg border border-borderMain hover:border-cyan hover:bg-cyan/5 transition-all group">
                    <div class="font-bold text-textMain group-hover:text-cyan text-lg">Move to Next Week</div>
                </button>
                <button id="btn-copy-tasks" class="w-full text-left p-4 rounded-lg border border-borderMain hover:border-cyan hover:bg-cyan/5 transition-all group">
                    <div class="font-bold text-textMain group-hover:text-cyan text-lg">Copy to Next Week</div>
                </button>
            </div>
            <div class="flex justify-end pt-4 border-t border-borderMain">
                <button id="cancel-rollover-btn" class="px-5 py-2 text-textMuted font-bold hover:bg-bgHover rounded text-sm border border-borderMain">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="custom-context-menu" class="hidden absolute z-[100] bg-bgSurface border border-borderMain rounded-lg shadow-2xl py-1 w-48 text-sm text-textMain flex flex-col overflow-hidden backdrop-blur-md">
        <button id="ctx-capitalize" class="px-4 py-2 text-left hover:bg-bgHover hover:text-cyan transition-colors flex items-center gap-2">Capitalize First</button>
        <button id="ctx-fix-typos" class="px-4 py-2 text-left hover:bg-bgHover hover:text-cyan transition-colors flex items-center gap-2">Fix Common Typos</button>
        <div class="border-t border-borderMain my-1"></div>
        <button id="ctx-clear" class="px-4 py-2 text-left hover:bg-red-500/20 text-red-500 transition-colors flex items-center gap-2">Clear Input</button>
    </div>

    <!-- MAGIC SYNC LOGIC HERE -->
    <script type="module">
        import { db } from './src/firebase.js';
        import { doc, onSnapshot, setDoc } from "firebase/firestore";

        const icons = {
            pin: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>`,
            check: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`,
            uncheck: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"></circle></svg>`,
            trash: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`
        };
        let audioCtx = null;

            document.getElementById('rollover-modal').classList.add('hidden'); let mc=0; const s=getStartOfWeek(state.currentDate);
            for(let i=0;i<7;i++){const c=new Date(s);c.setDate(c.getDate()+i);const ds=formatLocalDate(c);const nd=new Date(c);nd.setDate(nd.getDate()+7);const nds=formatLocalDate(nd);if(state.calendar[ds]){const u=[],f=[];state.calendar[ds].forEach(t=>{if(!t.isCompleted){if(m==='copy'){u.push({...t,id:generateId()});f.push(t);}else u.push(t);mc++;}else f.push(t);});if(m==='move')state.calendar[ds]=f;if(u.length>0){if(!state.calendar[nds])state.calendar[nds]=[];state.calendar[nds].push(...u);}}}
            if(mc>0){saveState();showToast(`${m==='move'?'Moved':'Copied'} ${mc} tasks.`);}
        }
    </script>
</body>
