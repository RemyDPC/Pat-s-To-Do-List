<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- PWA Settings for App Feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1f1f1f" />
    <title>Pat's To-Do List</title>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: 'var(--bg-main)',
                        bgSurface: 'var(--bg-surface)',
                        bgHover: 'var(--bg-hover)',
                        textMain: 'var(--text-main)',
                        textMuted: 'var(--text-muted)',
                        borderMain: 'var(--border-main)',
                        cyan: '#00FFFF',
                        hotpink: '#FF007F',
                        lime: '#32CD32',
                        orange: '#FF5F00',
                        purple: '#9D00FF'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-main: hsl(0, 0%, 12%);
            --bg-surface: hsl(0, 0%, 18%);
            --bg-hover: hsl(0, 0%, 25%);
            --text-main: hsl(0, 0%, 95%);
            --text-muted: hsl(0, 0%, 65%);
            --border-main: hsl(0, 0%, 25%);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-main); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Task Cards Visual Modes & Interaction */
        .task-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
            cursor: grab;
        }
        .task-card:hover {
            transform: scale(1.02) translateY(-1px);
            z-index: 10;
        }
        .task-card:active, .task-card.is-dragging {
            cursor: grabbing !important;
        }

        /* Visual Styles */
        .style-border { border-left: 5px solid var(--task-color, transparent) !important; }
        .style-highlighter { background-color: var(--task-color-alpha, transparent) !important; border: 1px solid var(--task-color, transparent) !important; }
        .style-glow { box-shadow: 0 0 12px 2px var(--task-color-alpha, transparent) !important; border: 1px solid var(--task-color-alpha, transparent) !important; }
        .style-gradient { background: linear-gradient(135deg, var(--task-color-alpha, transparent) 0%, transparent 100%) !important; border: 1px solid var(--task-color-alpha, transparent) !important; }
        .style-retro { border-bottom: 4px solid var(--task-color, transparent) !important; }
        
        .drag-over { background-color: rgba(0, 255, 255, 0.1) !important; border-radius: 6px; box-shadow: inset 0 0 0 2px #00FFFF !important; }

        ::selection { background-color: rgba(0, 255, 255, 0.3); color: inherit; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
    </style>
</head>
<body class="bg-bgMain text-textMain h-screen flex flex-col overflow-hidden transition-colors duration-300">
    
    <!-- Header -->
    <header class="flex justify-between items-center px-6 py-3 bg-bgSurface shadow-md z-20">
        <div class="flex items-center gap-3">
            <h1 id="app-title" class="text-2xl font-black tracking-tight cursor-pointer hover:text-cyan transition-all transform origin-left" title="Double-click to rename">Pat's To-Do List</h1>
            <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-cyan/10 text-cyan border border-cyan/20 rounded-full select-none shadow-sm">Sync Active</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="settings-btn" class="p-1.5 mr-2 text-textMuted hover:text-cyan hover:bg-bgHover rounded-full transition-all hover:rotate-90" title="Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <svg class="w-4 h-4 text-textMain" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <input type="range" id="theme-slider" min="0" max="100" class="w-24 md:w-32 accent-cyan cursor-pointer" title="Adjust Brightness">
            <svg class="w-5 h-5 text-textMain" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-[22rem] flex flex-col bg-bgSurface border-r border-borderMain shadow-inner z-10 flex-shrink-0">
            <!-- Input Area -->
            <div class="p-4 border-b border-borderMain flex flex-col gap-3 relative">
                <input type="text" id="new-task-text" spellcheck="true" placeholder="What needs doing?" class="w-full p-2.5 bg-bgMain border border-borderMain rounded-md focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-shadow text-sm placeholder-textMuted shadow-inner text-textMain">
                <button id="add-task-btn" class="px-5 py-2.5 w-full bg-cyan text-black font-black uppercase tracking-wider rounded shadow hover:bg-opacity-90 hover:shadow-cyan/30 hover:shadow-lg transition-all transform hover:scale-[1.02] active:scale-95 text-sm mt-1">Add Task</button>
            </div>

            <!-- Backlog Zone -->
            <div class="flex-1 flex flex-col min-h-0">
                <h2 class="px-4 py-2 text-xs font-black text-textMuted uppercase tracking-widest bg-bgMain border-b border-borderMain shadow-sm z-10">Backlog (One-Time)</h2>
                <div id="backlog-list" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2 drag-container transition-all" data-zone="backlog"></div>
            </div>

            <!-- Library Zone -->
            <div class="flex-1 flex flex-col min-h-0 border-t-2 border-borderMain">
                <h2 class="px-4 py-2 text-xs font-black text-textMuted uppercase tracking-widest bg-bgMain border-b border-borderMain flex justify-between items-center shadow-sm z-10">
                    Library (Pinned)
                    <svg class="w-4 h-4 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" title="Drag to Calendar to CLONE"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                </h2>
                <div id="library-list" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2 drag-container transition-all" data-zone="library"></div>
            </div>

            <!-- Bottom Section -->
            <div class="mt-auto flex flex-col border-t border-borderMain">
                <div class="p-3 bg-bgSurface flex justify-between items-center text-xs border-b border-borderMain">
                    <span class="text-textMuted font-bold uppercase tracking-wider">Sync Status: <span id="sync-indicator" class="text-cyan">Live</span></span>
                </div>
            </div>
        </aside>

        <!-- Calendar Area -->
        <div class="flex-1 flex flex-col bg-bgMain relative min-w-0">
            <!-- Calendar Toolbar -->
            <div class="px-6 py-4 border-b border-borderMain flex justify-between items-center bg-bgSurface shadow-sm z-10">
                <div class="flex items-center gap-2">
                    <button id="prev-week" class="px-3 py-1.5 bg-bgMain border border-borderMain text-textMain rounded font-bold hover:bg-bgHover hover:text-cyan transition-colors shadow-sm">&larr; Prev</button>
                    <button id="today-btn" class="px-4 py-1.5 border-2 border-cyan text-cyan font-bold rounded hover:bg-cyan hover:text-bgMain transition-all shadow-sm">Today</button>
                    <button id="next-week" class="px-3 py-1.5 bg-bgMain border border-borderMain text-textMain rounded font-bold hover:bg-bgHover hover:text-cyan transition-colors shadow-sm">Next &rarr;</button>
                </div>
                <h2 id="week-label" class="text-xl font-black tracking-tight flex-1 text-center">Week of ...</h2>
                <div class="flex items-center gap-3">
                    <button id="rollover-btn" class="px-3 py-1.5 text-sm font-bold bg-orange/10 text-orange border border-orange/30 rounded hover:bg-orange hover:text-bgMain transition-all shadow-sm flex items-center gap-1">Move Unfinished &rarr;</button>
                    <div class="relative group">
                        <label class="cursor-pointer flex items-center gap-2 p-2 rounded-full hover:bg-bgHover hover:text-cyan transition-colors shadow-sm border border-transparent hover:border-borderMain bg-bgSurface">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <input type="date" id="date-picker" class="absolute opacity-0 w-full h-full cursor-pointer top-0 left-0">
                        </label>
                    </div>
                </div>
            </div>

            <!-- Weekly Progress Bar -->
            <div class="w-full h-1.5 bg-bgSurface border-b border-borderMain relative z-10">
                <div id="weekly-progress" class="h-full bg-gradient-to-r from-hotpink via-purple to-cyan w-0 transition-all duration-500 ease-out"></div>
            </div>

            <!-- Calendar Grid -->
            <div class="flex-1 overflow-x-auto overflow-y-hidden custom-scroll">
                <div id="calendar-grid" class="grid grid-cols-7 divide-x divide-borderMain min-w-[1100px] h-full pb-2">
                    <!-- JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Settings -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-bgSurface p-6 rounded-xl shadow-2xl w-[24rem] transform transition-transform duration-200 border border-borderMain text-textMain">
            <h3 class="text-xl font-black mb-5 tracking-tight flex items-center gap-2">Settings</h3>
            <div class="mb-5 bg-bgMain p-4 rounded-lg border border-borderMain">
                <label class="flex items-center justify-between cursor-pointer group">
                    <span class="text-sm font-bold text-textMain group-hover:text-cyan transition-colors">Sound Effects</span>
                    <div class="relative">
                        <input type="checkbox" id="settings-sound-toggle" class="sr-only">
                        <div class="block bg-borderMain w-10 h-6 rounded-full transition-colors duration-300" id="toggle-bg"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300" id="toggle-dot"></div>
                    </div>
                </label>
                <div class="mt-4 pt-4 border-t border-borderMain">
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-textMuted">Sound Pack</label>
                    <select id="settings-sound-pack" class="w-full p-2 bg-bgSurface border border-borderMain hover:border-cyan transition-colors rounded text-sm outline-none cursor-pointer shadow-sm text-textMain">
                        <option value="party">Party Horn 🎉</option>
                        <option value="levelup">Level Up ⬆️</option>
                        <option value="fanfare">Fanfare 🎺</option>
                        <option value="cheer">Crowd Cheer 👏</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button id="close-settings-btn" class="px-6 py-2 bg-cyan text-black font-black uppercase tracking-wider rounded shadow-md hover:bg-opacity-90 hover:shadow-cyan/30 transition-all transform hover:scale-105 active:scale-95 text-sm">Save & Close</button>
            </div>
        </div>
    </div>

    <!-- Modal for Edit Task (Simplified for length, full logic in JS) -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-bgSurface p-6 rounded-xl shadow-2xl w-[32rem] transform transition-transform duration-200 border border-borderMain text-textMain">
            <h3 class="text-xl font-black mb-5 tracking-tight">Edit Task</h3>
            <input type="text" id="edit-text" spellcheck="true" class="w-full p-3 mb-5 bg-bgMain border border-borderMain rounded-md focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan text-sm shadow-inner font-medium text-textMain">
            <div class="mb-5">
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-textMuted">Color Palette</label>
                <div class="grid grid-cols-9 gap-2" id="edit-color-picker"></div>
            </div>
            <div class="mb-5">
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-textMuted">Visual Style</label>
                <div class="grid grid-cols-3 gap-3 bg-bgMain p-3 rounded-md border border-borderMain">
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="dot" class="text-cyan accent-cyan"> Dot</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="border" class="text-cyan accent-cyan"> Border</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="highlighter" class="text-cyan accent-cyan"> Highlight</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="glow" class="text-cyan accent-cyan"> Glow</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="gradient" class="text-cyan accent-cyan"> Gradient</label>
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer hover:text-cyan text-textMain"><input type="radio" name="edit-style" value="retro" class="text-cyan accent-cyan"> Retro</label>
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-textMuted">Emoji</label>
                <div class="flex flex-col bg-bgMain border border-borderMain rounded-md shadow-inner overflow-hidden">
                    <div class="flex justify-between items-center p-2 border-b border-borderMain bg-bgSurface">
                        <div id="edit-emoji-preview" class="text-xl min-h-[32px] flex-1 truncate px-2 text-textMain tracking-widest">none</div>
                        <div class="flex gap-1.5 items-center">
                            <button id="edit-emoji-backspace" class="px-2.5 py-1 bg-bgMain border border-borderMain rounded text-textMuted hover:text-red-500">⌫</button>
                            <button id="edit-emoji-clear" class="px-2.5 py-1 bg-bgMain border border-borderMain rounded text-textMuted hover:text-red-500 text-xs font-bold">Clear</button>
                            <button id="edit-emoji-done" class="ml-1 px-3 py-1 bg-cyan text-black rounded text-xs font-bold uppercase">Done ✓</button>
                        </div>
                    </div>
                    <div id="edit-emoji-tabs" class="flex gap-1 overflow-x-auto custom-scroll p-2 border-b border-borderMain bg-bgSurface"></div>
                    <div id="edit-emoji-grid" class="grid grid-cols-10 gap-2 h-40 overflow-y-auto p-2 custom-scroll bg-bgMain"></div>
                </div>
            </div>
            <div class="flex justify-between items-center mt-6 pt-5 border-t border-borderMain">
                <button id="delete-edit-btn" class="px-4 py-2 text-red-500 font-bold hover:bg-red-500/20 rounded transition-colors text-sm">Delete Task</button>
                <div class="flex gap-3">
                    <button id="cancel-edit-btn" class="px-5 py-2 text-textMuted font-bold hover:bg-bgHover rounded transition-colors text-sm border border-borderMain">Cancel</button>
                    <button id="save-edit-btn" class="px-6 py-2 bg-cyan text-black font-black uppercase tracking-wider rounded shadow-md hover:bg-opacity-90 hover:shadow-cyan/30 transition-all transform hover:scale-105 active:scale-95 text-sm">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Delete Confirmation -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-bgSurface p-6 rounded-xl shadow-2xl w-[24rem] border border-borderMain text-textMain">
            <h3 class="text-xl font-black mb-2 tracking-tight text-red-500">Delete Task</h3>
            <p class="text-sm text-textMuted mb-6">Are you sure? This cannot be undone.</p>
            <div class="flex justify-end gap-3 pt-4 border-t border-borderMain">
                <button id="cancel-delete-btn" class="px-5 py-2 text-textMuted font-bold hover:bg-bgHover rounded text-sm border border-borderMain">Cancel</button>
                <button id="confirm-delete-btn" class="px-6 py-2 bg-red-500 text-white font-black uppercase tracking-wider rounded text-sm hover:bg-red-600">Delete</button>
            </div>
        </div>
    </div>

    <!-- Modal for Rollover -->
    <div id="rollover-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-bgSurface p-6 rounded-xl shadow-2xl w-[28rem] border border-borderMain text-textMain">
            <h3 class="text-xl font-black mb-2 tracking-tight">Rollover Tasks</h3>
            <div class="flex flex-col gap-3 mb-6">
                <button id="btn-move-tasks" class="w-full text-left p-4 rounded-lg border border-borderMain hover:border-cyan hover:bg-cyan/5 transition-all group">
                    <div class="font-bold text-textMain group-hover:text-cyan text-lg">Move to Next Week</div>
                </button>
                <button id="btn-copy-tasks" class="w-full text-left p-4 rounded-lg border border-borderMain hover:border-cyan hover:bg-cyan/5 transition-all group">
                    <div class="font-bold text-textMain group-hover:text-cyan text-lg">Copy to Next Week</div>
                </button>
            </div>
            <div class="flex justify-end pt-4 border-t border-borderMain">
                <button id="cancel-rollover-btn" class="px-5 py-2 text-textMuted font-bold hover:bg-bgHover rounded text-sm border border-borderMain">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN LOGIC + FIREBASE SYNC -->
    <script type="module">
        // 1. IMPORT FIREBASE (This makes it Sync!)
        import { db } from './src/firebase.js';
        import { doc, onSnapshot, setDoc } from "firebase/firestore";

        // --- DATA & CONFIG ---
        const icons = {
            pin: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>`,
            check: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`,
            uncheck: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"></circle></svg>`,
            trash: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`
        };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }

        const COLORS = [
            { name: 'None', hex: null }, { name: 'Pitch Black', hex: '#000000' }, { name: 'Bubblegum Pink', hex: '#FF69B4' },
            { name: 'Hot Pink', hex: '#FF1493' }, { name: 'Cyan', hex: '#00FFFF' }, { name: 'Lime', hex: '#32CD32' },
            { name: 'Orange', hex: '#FF8C00' }, { name: 'Purple', hex: '#9400D3' }, { name: 'White', hex: '#FFFFFF' }
        ];
        
        const EMOJIS = {
            'Status': ['none', '❌', '✅', '🚩', '🚨', '🔥', '⭐'],
            'Faces': ['none', '😀', '😎', '🤯', '🤠', '🤡', '👻'],
            'Animals': ['none', '🐶', '🐱', '🐸', '🦄', '🦖'],
            'Objects': ['none', '📚', '💻', '💰', '🔑', '🛒']
        };

        function formatLocalDate(date) {
            return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
        }

        let state = {
            appName: "Pat's To-Do List",
            themeValue: 12,
            soundEnabled: false,
            soundPack: 'party',
            currentDate: formatLocalDate(new Date()),
            backlog: [],
            library: [],
            calendar: {}
        };

        function generateId() { return Date.now().toString() + Math.random().toString(36).substr(2, 5); }

        // --- FIREBASE SYNC FUNCTIONS (REPLACING LOCALSTORAGE) ---
        const docRef = doc(db, "sync-app", "global-data");

        // 1. SAVE to Cloud
        async function saveState() { 
            try {
                await setDoc(docRef, state);
            } catch(e) { console.error("Sync Error", e); }
        }
        
        // 2. LOAD from Cloud (Real-time)
        function loadState() {
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    // Update local state with cloud state
                    const data = docSnap.data();
                    state = { ...state, ...data };
                    
                    // Fix arrays if missing
                    if(!Array.isArray(state.backlog)) state.backlog = [];
                    if(!Array.isArray(state.library)) state.library = [];
                    if(!state.calendar) state.calendar = {};

                    // Apply UI updates
                    updateTheme(state.themeValue || 12);
                    const slider = document.getElementById('theme-slider');
                    if(slider) slider.value = state.themeValue || 12;
                    document.getElementById('app-title').textContent = state.appName;
                    
                    renderAll();
                } else {
                    // First time? Create default
                    saveState();
                }
            });
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            setupTitleEdit();
            setupEventListeners();
            setupSettings();
            loadState(); // Starts the Firebase listener
        });

        let isPinActive = false;

        function setupEventListeners() {
            document.getElementById('add-task-btn').onclick = addTask;
            document.getElementById('new-task-text').addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

            const slider = document.getElementById('theme-slider');
            slider.addEventListener('input', (e) => updateTheme(e.target.value));
            slider.addEventListener('change', (e) => { state.themeValue = e.target.value; saveState(); });

            document.addEventListener('dblclick', (e) => {
                const taskEl = e.target.closest('.task-item');
                if (taskEl) {
                    e.stopPropagation();
                    window.getSelection().removeAllRanges(); 
                    openEditor(taskEl.getAttribute('data-id'), taskEl.getAttribute('data-zone'), taskEl.getAttribute('data-date'));
                }
            });

            document.getElementById('prev-week').onclick = () => shiftWeek(-1);
            document.getElementById('next-week').onclick = () => shiftWeek(1);
            document.getElementById('today-btn').onclick = () => { state.currentDate = formatLocalDate(new Date()); saveState(); };
            document.getElementById('date-picker').addEventListener('change', (e) => { if(e.target.value) { state.currentDate = e.target.value; saveState(); } });

            // Editor
            document.getElementById('cancel-edit-btn').onclick = closeEditor;
            document.getElementById('save-edit-btn').onclick = saveEdit;
            document.getElementById('delete-edit-btn').onclick = deleteFromEditor;
            
            // Delete
            document.getElementById('cancel-delete-btn').onclick = cancelDelete;
            document.getElementById('confirm-delete-btn').onclick = confirmDelete;
            
            // Emoji
            document.getElementById('edit-emoji-backspace').onclick = (e) => { e.preventDefault(); /* simplified for brevity */ };
            document.getElementById('edit-emoji-clear').onclick = (e) => { e.preventDefault(); if(editingContext) { editingContext.tempEmoji = 'none'; renderEditorPickers(editingContext.tempColor, 'none', editingContext.activeEmojiCategory); }};
            document.getElementById('edit-emoji-done').onclick = (e) => { e.preventDefault(); saveEdit(); };

            // Rollover
            document.getElementById('rollover-btn').onclick = () => document.getElementById('rollover-modal').classList.remove('hidden');
            document.getElementById('cancel-rollover-btn').onclick = () => document.getElementById('rollover-modal').classList.add('hidden');
            document.getElementById('btn-move-tasks').onclick = () => rollOverTasks('move');
            document.getElementById('btn-copy-tasks').onclick = () => rollOverTasks('copy');
        }

        function addTask() {
            const input = document.getElementById('new-task-text');
            let text = input.value.trim();
            if (!text) return;
            
            const newTask = { id: generateId(), text, color: null, emoji: 'none', style: 'dot', isPinned: isPinActive, isCompleted: false };
            if (isPinActive) state.library.push(newTask);
            else state.backlog.push(newTask);
            
            input.value = '';
            saveState();
        }

        function renderAll() {
            renderSidebar();
            renderCalendar();
            setupDragAndDrop();
        }

        function renderSidebar() {
            const backlogList = document.getElementById('backlog-list');
            const libraryList = document.getElementById('library-list');
            backlogList.innerHTML = ''; libraryList.innerHTML = '';
            state.backlog.sort((a,b) => a.isCompleted - b.isCompleted).forEach(t => backlogList.appendChild(createTaskElement(t, 'backlog')));
            state.library.sort((a,b) => a.isCompleted - b.isCompleted).forEach(t => libraryList.appendChild(createTaskElement(t, 'library')));
        }

        function createTaskElement(task, zone, dateString = null) {
            const el = document.createElement('div');
            el.className = `task-item task-card flex flex-col p-2.5 rounded-md bg-bgSurface border border-borderMain shadow-sm relative group select-none ${task.isCompleted ? 'opacity-50' : ''}`;
            el.draggable = true;
            el.id = `task-${task.id}`;
            el.setAttribute('data-id', task.id); el.setAttribute('data-zone', zone);
            if (dateString) el.setAttribute('data-date', dateString);
            
            if (task.color) {
                el.style.setProperty('--task-color', task.color); el.style.setProperty('--task-color-alpha', task.color + '33'); 
                if (task.style) el.classList.add(`style-${task.style}`);
            }

            el.ondragstart = (e) => {
                const dragData = JSON.stringify({ id: task.id, zone, date: dateString });
                e.dataTransfer.setData('text/plain', dragData);
                setTimeout(() => el.style.opacity = '0.4', 0); el.classList.add('is-dragging');
            };
            el.ondragend = () => { el.style.opacity = task.isCompleted ? '0.5' : '1'; el.classList.remove('is-dragging'); renderAll(); };

            const topRow = document.createElement('div'); topRow.className = 'flex items-start gap-1.5 w-full relative';
            const leftPart = document.createElement('div'); leftPart.className = 'flex items-start gap-2 flex-1 min-w-0 w-full';
            
            if (task.style === 'dot' && task.color) {
                const dot = document.createElement('span'); dot.className = 'w-3 h-3 rounded-full flex-shrink-0 shadow-sm border border-black/10 mt-1';
                dot.style.backgroundColor = task.color; leftPart.appendChild(dot);
            }
            const textContainer = document.createElement('div');
            textContainer.className = `text-sm font-semibold break-words whitespace-normal leading-snug flex-1 min-w-0 ${task.isCompleted ? 'line-through text-textMuted' : 'text-textMain'}`;
            if (task.emoji && task.emoji !== 'none') textContainer.innerHTML += `<span class="text-lg drop-shadow-sm mr-1.5">${task.emoji}</span>`;
            textContainer.appendChild(document.createTextNode(task.text));
            leftPart.appendChild(textContainer); topRow.appendChild(leftPart);

            const rightPart = document.createElement('div');
            rightPart.className = 'absolute -top-1 -right-1 hidden group-hover:flex items-center gap-0.5 bg-bgSurface/95 backdrop-blur-md p-1 rounded-lg shadow-md border border-borderMain z-20';
            const trashBtn = document.createElement('button'); trashBtn.innerHTML = icons.trash; trashBtn.className = 'p-1.5 text-red-500 hover:bg-red-500/20 rounded transition-colors';
            trashBtn.onclick = (e) => { e.stopPropagation(); requestDelete(task.id, zone, dateString); };
            const checkBtn = document.createElement('button'); checkBtn.innerHTML = task.isCompleted ? icons.check : icons.uncheck;
            checkBtn.className = `p-1.5 rounded transition-colors hover:bg-bgHover ${task.isCompleted ? 'text-lime' : 'text-textMuted hover:text-lime'}`;
            checkBtn.onclick = (e) => { e.stopPropagation(); toggleComplete(task.id, zone, dateString, e); };
            rightPart.appendChild(trashBtn); rightPart.appendChild(checkBtn);
            
            el.appendChild(topRow); el.appendChild(rightPart);
            return el;
        }

        function getStartOfWeek(date) {
            let d;
            if (typeof date === 'string' && date.length <= 10) { const parts = date.split('-'); d = new Date(parts[0], parts[1] - 1, parts[2]); } else { d = new Date(date); }
            const day = d.getDay(); d.setDate(d.getDate() - day); d.setHours(0,0,0,0); return d;
        }

        function shiftWeek(offset) {
            let d;
            if (typeof state.currentDate === 'string' && state.currentDate.length <= 10) { const parts = state.currentDate.split('-'); d = new Date(parts[0], parts[1] - 1, parts[2]); } else { d = new Date(state.currentDate); }
            d.setDate(d.getDate() + (offset * 7)); state.currentDate = formatLocalDate(d); saveState();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
            const startOfWeek = getStartOfWeek(state.currentDate);
            const endOfWeek = new Date(startOfWeek); endOfWeek.setDate(endOfWeek.getDate() + 6);
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            let labelText = `Week of ${monthNames[startOfWeek.getMonth()]} ${startOfWeek.getDate()}`;
            if(startOfWeek.getMonth() !== endOfWeek.getMonth()) labelText += ` - ${monthNames[endOfWeek.getMonth()]} ${endOfWeek.getDate()}`;
            else labelText += ` - ${endOfWeek.getDate()}`;
            document.getElementById('week-label').textContent = labelText;
            document.getElementById('date-picker').value = typeof state.currentDate === 'string' ? state.currentDate.split('T')[0] : formatLocalDate(new Date());

            const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const todayStr = formatLocalDate(new Date());
            
            let total = 0; let completed = 0;
            
            for (let i = 0; i < 7; i++) {
                const currentDate = new Date(startOfWeek); currentDate.setDate(currentDate.getDate() + i);
                const dateStr = formatLocalDate(currentDate);
                const col = document.createElement('div'); col.className = 'flex flex-col h-full border-r border-borderMain last:border-r-0 min-h-0';
                const isToday = dateStr === todayStr;
                col.innerHTML = `<div class="p-3 text-center border-b border-borderMain bg-bgSurface ${isToday ? 'shadow-[inset_0_-3px_0_0_#00FFFF]' : ''}"><div class="text-xs font-black uppercase tracking-wider ${isToday ? 'text-cyan' : 'text-textMuted'}">${dayNames[i]}</div><div class="text-lg font-bold ${isToday ? 'text-cyan' : ''}">${monthNames[currentDate.getMonth()]} ${currentDate.getDate()}</div></div>`;
                const dropZone = document.createElement('div'); dropZone.className = 'flex-1 p-3 overflow-y-auto custom-scroll space-y-2 drag-container transition-colors min-h-0 bg-bgMain';
                dropZone.setAttribute('data-zone', 'calendar'); dropZone.setAttribute('data-date', dateStr);
                const tasks = state.calendar[dateStr] || [];
                total += tasks.length; completed += tasks.filter(t => t.isCompleted).length;
                tasks.sort((a,b) => a.isCompleted - b.isCompleted).forEach(t => dropZone.appendChild(createTaskElement(t, 'calendar', dateStr)));
                col.appendChild(dropZone); grid.appendChild(col);
            }
            document.getElementById('weekly-progress').style.width = total === 0 ? '0%' : `${(completed / total) * 100}%`;
        }

        function setupDragAndDrop() {
            document.querySelectorAll('.drag-container').forEach(zone => {
                zone.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; zone.classList.add('drag-over'); 
                    const afterElement = getDragAfterElement(zone, e.clientY);
                    const currentDragging = document.querySelector('.is-dragging');
                    if (currentDragging) {
                        if (afterElement == null) zone.appendChild(currentDragging);
                        else zone.insertBefore(currentDragging, afterElement);
                    }
                };
                zone.ondragleave = (e) => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); };
                zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove('drag-over'); 
                    const dataStr = e.dataTransfer.getData('text/plain'); if (!dataStr) return;
                    const data = JSON.parse(dataStr);
                    handleDrop(data.id, data.zone, data.date, zone.getAttribute('data-zone'), zone.getAttribute('data-date'));
                };
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.task-item:not(.is-dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect(); const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child }; else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function handleDrop(taskId, sourceZone, sourceDate, targetZone, targetDate) {
            const sourceList = getTaskList(sourceZone, sourceDate);
            const taskIndex = sourceList.findIndex(t => t.id === taskId); if (taskIndex === -1) return;
            const task = sourceList[taskIndex];
            
            let cloneTask = (sourceZone === 'library' && targetZone === 'calendar');
            let taskToMove = cloneTask ? { ...task, id: generateId() } : task;
            
            if (!cloneTask) sourceList.splice(taskIndex, 1);
            if (targetZone === 'library') taskToMove.isPinned = true; else if (targetZone === 'backlog') taskToMove.isPinned = false;

            const targetList = getTaskList(targetZone, targetDate, true);
            targetList.push(taskToMove);
            saveState();
        }

        function toggleComplete(id, zone, dateString, event) {
            let taskList = getTaskList(zone, dateString);
            const task = taskList.find(t => t.id === id);
            if(task) {
                task.isCompleted = !task.isCompleted;
                if(task.isCompleted) {
                    if(state.soundEnabled) playSynthesizedSound(state.soundPack);
                    if(typeof confetti !== 'undefined') confetti({ particleCount: 100, spread: 80, origin: { x: event ? event.clientX/window.innerWidth : 0.5, y: event ? event.clientY/window.innerHeight : 0.5 } });
                }
                saveState();
            }
        }

        function deleteTask(id, zone, dateString) {
            const sourceList = getTaskList(zone, dateString);
            const idx = sourceList.findIndex(t => t.id === id);
            if (idx !== -1) { sourceList.splice(idx, 1); saveState(); }
        }

        function getTaskList(zone, dateString, create = false) {
            if (zone === 'backlog') return state.backlog;
            if (zone === 'library') return state.library;
            if (zone === 'calendar') {
                if (create && !state.calendar[dateString]) state.calendar[dateString] = [];
                return state.calendar[dateString] || [];
            }
            return [];
        }

        let editingContext = null;
        function openEditor(taskId, zone, dateString) {
            const taskList = getTaskList(zone, dateString);
            const task = taskList.find(t => t.id === taskId);
            if (!task) return;
            editingContext = { task, zone, dateString };
            document.getElementById('edit-text').value = task.text;
            renderEditorPickers(task.color, task.emoji, 'Faces');
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function renderEditorPickers(activeColor, activeEmoji, activeEmojiCategory) {
            const cp = document.getElementById('edit-color-picker'); cp.innerHTML = '';
            COLORS.forEach(c => {
                const btn = document.createElement('button'); btn.className = `w-7 h-7 rounded-full mx-auto border ${activeColor === c.hex ? 'ring-2 ring-cyan scale-125' : ''}`;
                if(c.hex) btn.style.backgroundColor = c.hex; else btn.textContent = '🚫';
                btn.onclick = () => renderEditorPickers(c.hex, editingContext.tempEmoji, activeEmojiCategory);
                cp.appendChild(btn);
            });
            const et = document.getElementById('edit-emoji-tabs'); et.innerHTML = '';
            Object.keys(EMOJIS).forEach(cat => {
                const tab = document.createElement('button'); tab.className = `px-3 py-1 text-xs rounded-md ${activeEmojiCategory === cat ? 'bg-cyan text-black' : 'bg-bgSurface text-textMuted'}`;
                tab.textContent = cat; tab.onclick = () => renderEditorPickers(editingContext.tempColor, editingContext.tempEmoji, cat);
                et.appendChild(tab);
            });
            const eg = document.getElementById('edit-emoji-grid'); eg.innerHTML = '';
            EMOJIS[activeEmojiCategory].forEach(e => {
                const btn = document.createElement('button'); btn.className = 'text-2xl rounded p-1 hover:bg-bgHover';
                btn.textContent = e === 'none' ? '🚫' : e;
                btn.onclick = () => { editingContext.tempEmoji = e; renderEditorPickers(editingContext.tempColor, e, activeEmojiCategory); };
                eg.appendChild(btn);
            });
            editingContext.tempColor = activeColor; editingContext.tempEmoji = activeEmoji; editingContext.activeEmojiCategory = activeEmojiCategory;
            document.getElementById('edit-emoji-preview').textContent = activeEmoji || 'none';
        }

        let pendingDeleteContext = null;
        function requestDelete(id, zone, dateString) { pendingDeleteContext = { id, zone, dateString }; document.getElementById('delete-modal').classList.remove('hidden'); }
        function confirmDelete() { if(pendingDeleteContext) deleteTask(pendingDeleteContext.id, pendingDeleteContext.zone, pendingDeleteContext.dateString); cancelDelete(); }
        function cancelDelete() { pendingDeleteContext = null; document.getElementById('delete-modal').classList.add('hidden'); }
        function deleteFromEditor() { if(editingContext) requestDelete(editingContext.task.id, editingContext.zone, editingContext.dateString); closeEditor(); }
        
        function saveEdit() {
            if (!editingContext) return;
            let text = document.getElementById('edit-text').value.trim();
            if (!text) return;
            let selectedStyle = 'dot';
            document.getElementsByName('edit-style').forEach(radio => { if (radio.checked) selectedStyle = radio.value; });
            
            editingContext.task.text = text;
            editingContext.task.style = selectedStyle;
            editingContext.task.color = editingContext.tempColor;
            editingContext.task.emoji = editingContext.tempEmoji;
            saveState(); closeEditor();
        }
        function closeEditor() { document.getElementById('edit-modal').classList.add('hidden'); editingContext = null; }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-bgSurface border border-borderMain text-textMain px-4 py-3 rounded-md shadow-2xl flex items-center gap-3 font-medium text-sm';
            toast.textContent = msg; container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function rollOverTasks(mode) {
            document.getElementById('rollover-modal').classList.add('hidden');
            let movedCount = 0; const startOfWeek = getStartOfWeek(state.currentDate);
            for (let i = 0; i < 7; i++) {
                const currentDate = new Date(startOfWeek); currentDate.setDate(currentDate.getDate() + i);
                const dateStr = formatLocalDate(currentDate);
                const nextWeekDate = new Date(currentDate); nextWeekDate.setDate(nextWeekDate.getDate() + 7);
                const nextDateStr = formatLocalDate(nextWeekDate);
                if (state.calendar[dateStr]) {
                    const unfinished = []; const finished = [];
                    state.calendar[dateStr].forEach(task => {
                        if (!task.isCompleted) {
                            if (mode === 'copy') { unfinished.push({ ...task, id: generateId() }); finished.push(task); } else { unfinished.push(task); }
                            movedCount++;
                        } else { finished.push(task); }
                    });
                    if (mode === 'move') state.calendar[dateStr] = finished;
                    if (unfinished.length > 0) { if (!state.calendar[nextDateStr]) state.calendar[nextDateStr] = []; state.calendar[nextDateStr].push(...unfinished); }
                }
            }
            if(movedCount > 0) { saveState(); showToast(`${mode === 'move' ? 'Moved' : 'Copied'} ${movedCount} tasks.`); }
        }

        // Settings (Simplified)
        function setupSettings() {
            const settingsBtn = document.getElementById('settings-btn'); const settingsModal = document.getElementById('settings-modal');
            const closeBtn = document.getElementById('close-settings-btn'); const toggle = document.getElementById('settings-sound-toggle');
            settingsBtn.onclick = () => { 
                settingsModal.classList.remove('hidden'); toggle.checked = state.soundEnabled; 
                document.getElementById('toggle-bg').classList.toggle('bg-cyan', state.soundEnabled); 
            };
            closeBtn.onclick = () => settingsModal.classList.add('hidden');
            toggle.onchange = () => { 
                state.soundEnabled = toggle.checked; saveState(); 
                document.getElementById('toggle-bg').classList.toggle('bg-cyan', state.soundEnabled); 
                document.getElementById('toggle-dot').classList.toggle('translate-x-4', state.soundEnabled); 
            };
        }
        function updateTheme(val) {
            const root = document.documentElement;
            root.style.setProperty('--bg-main', `hsl(0, 0%, ${val}%)`);
            root.style.setProperty('--bg-surface', `hsl(0, 0%, ${Math.max(0, val < 50 ? Number(val) + 6 : Number(val) - 3)}%)`);
            root.style.setProperty('--bg-hover', `hsl(0, 0%, ${Math.max(0, val < 50 ? Number(val) + 12 : Number(val) - 8)}%)`);
            root.style.setProperty('--border-main', `hsl(0, 0%, ${Math.max(0, val < 50 ? Number(val) + 15 : Number(val) - 15)}%)`);
            if (val < 50) { root.style.setProperty('--text-main', `hsl(0, 0%, 95%)`); root.style.setProperty('--text-muted', `hsl(0, 0%, 65%)`); } 
            else { root.style.setProperty('--text-main', `hsl(0, 0%, 10%)`); root.style.setProperty('--text-muted', `hsl(0, 0%, 40%)`); }
        }
        function setupTitleEdit() {
            const t = document.getElementById('app-title');
            t.ondblclick = () => { t.contentEditable = "true"; t.focus(); };
            t.onblur = () => { t.contentEditable = "false"; if(t.textContent !== state.appName) { state.appName = t.textContent; saveState(); }};
        }
        function playSynthesizedSound(type) {
            initAudio(); const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            if(type==='party'){osc.frequency.setValueAtTime(523,t);osc.frequency.setValueAtTime(1046,t+0.2);gain.gain.linearRampToValueAtTime(0.3,t+0.05);osc.start(t);osc.stop(t+0.6);}
            else {osc.frequency.setValueAtTime(200,t);gain.gain.linearRampToValueAtTime(0.1,t+0.1);osc.start(t);osc.stop(t+0.2);}
        }
    </script>
</body>
</html>
